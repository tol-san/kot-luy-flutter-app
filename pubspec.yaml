name: kot_loy
description: A gentle, offline Khmer expense companion with SQLite storage.
publish_to: 'none'
version: 1.0.1+2
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.3
  path: ^1.9.1
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  sqflite_common_ffi_web: ^1.1.2
  clock: ^1.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/illustrations/
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/NotoSansKhmer.ttf

